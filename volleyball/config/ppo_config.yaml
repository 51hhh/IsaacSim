# RSL-RL PPO 配置
# 排球接球任务

runner:
  class_name: OnPolicyRunner
  
  # 通用参数
  num_steps_per_env: 24      # 每次迭代每个环境收集的步数
  max_iterations: 5000       # 策略更新次数
  seed: 42
  
  # 观察组配置
  obs_groups: 
    actor: ["policy"]        # Actor 使用 policy 观察
    critic: ["policy"]       # Critic 也使用 policy 观察
  
  # 日志参数
  save_interval: 100         # 每 100 次迭代检查保存
  experiment_name: volleyball_catch
  run_name: ""
  
  # 日志记录器
  logger: tensorboard        # tensorboard, neptune, wandb
  wandb_project: volleyball_catch

  # Actor 网络配置
  actor:
    class_name: MLPModel
    hidden_dims: [128, 128]  # 2 层 MLP，每层 128 节点
    activation: elu
    obs_normalization: true   # 启用观察归一化
    stochastic: true         # 随机策略
    init_noise_std: 0.5      # 初始噪声标准差
    noise_std_type: "scalar" # 'scalar' 或 'log'
    state_dependent_std: false
  
  # Critic 网络配置
  critic:
    class_name: MLPModel
    hidden_dims: [128, 128]
    activation: elu
    obs_normalization: true
    stochastic: false        # Critic 是确定性的

  # PPO 算法配置
  algorithm:
    class_name: PPO
    
    # 训练参数
    optimizer: adam
    learning_rate: 0.0003    # 学习率
    num_learning_epochs: 5   # 每次更新的训练 epoch 数
    num_mini_batches: 4      # mini batch 数量
    schedule: adaptive       # 学习率调度: adaptive, fixed
    
    # Value function
    value_loss_coef: 1.0
    clip_param: 0.2          # PPO clip 参数
    use_clipped_value_loss: true
    
    # Surrogate loss
    desired_kl: 0.01         # 目标 KL 散度
    entropy_coef: 0.01       # 熵系数 (鼓励探索)
    gamma: 0.99              # 折扣因子
    lam: 0.95                # GAE lambda
    max_grad_norm: 1.0       # 梯度裁剪
    
    # 其他
    normalize_advantage_per_mini_batch: false

    # Random Network Distillation (禁用)
    rnd_cfg:
      weight: 0.0
      weight_schedule: null
      reward_normalization: false
      learning_rate: 0.001
      num_outputs: 1
      predictor_hidden_dims: [-1]
      target_hidden_dims: [-1]

    # 对称性增强 (完全禁用)
    symmetry_cfg: null
